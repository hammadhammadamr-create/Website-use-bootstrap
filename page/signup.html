<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Learna - Online Learning Platform</title>
</head>
<body class="bg-light text-dark">

  <div class="container py-5">

    <div class="row justify-content-center">

      <div class="col-lg-6 col-md-8">

        <form action="hero.html" method="get" class="bg-white p-4 rounded-3 shadow-sm" id="signup-form">

          <div class="text-center mb-4">

            <h2 class="fw-bold">Create Account</h2>

            <p class="text-muted">Join us and start learning today</p>

          </div>

          <div class="mb-3">
            <input type="email" class="form-control" placeholder="Email" id="email">
          </div>

          <div class="row">

            <div class="col-md-6 mb-3">
              <input type="text" class="form-control" placeholder="First Name" id="first-name">
            </div>

            <div class="col-md-6 mb-3">
              <input type="text" class="form-control" placeholder="Last Name" id="last-name">
            </div>

          </div>

          <div class="row">
            <div class="col-md-6 mb-3">

              <select class="form-select" id="country">
                <option selected disabled hidden>Choose your country</option>
                <option>Egypt</option>
                <option>Canada</option>
                <option>USA</option>
                <option>Russia</option>
              </select>

            </div>

            <div class="col-md-6 mb-3 ">
              <input type="date" class="form-control" id="birthdate">
            </div>
          </div>

          <div class="row">

            <div class="col-md-6 mb-3">
              <input type="password" class="form-control" placeholder="Password" id="password">
            </div>

            <div class="col-md-6 mb-3">
              <input type="password" class="form-control" placeholder="Confirm Password" id="confirm-password">
            </div>

          </div>

          <div class="text-center my-4">

            <p class="text-muted">Or continue with</p>

            <div class="d-flex justify-content-center gap-3">
              <a href="#" class="btn btn-light border rounded-circle"><i class="bi bi-google text-danger"></i></a>
              
              <a href="#" class="btn btn-light border rounded-circle"><i class="bi bi-facebook text-primary"></i></a>

              <a href="#" class="btn btn-light border rounded-circle"><i class="bi bi-apple"></i></a>
            </div>

          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary w-100" id="signup"><i class="bi bi-person-plus-fill me-2"></i>Sign Up</button>
          <button type="button" class="bg-white border-0 my-3 w-100 text-center text-decoration-underline text-primary" id="btn-signup">Already have an account? Log In</button>
        </form>

        <form action="hero.html" method="get" class="bg-white p-4 rounded-3 shadow-sm" id="login-form" style="display: none;">

          <div class="text-center mb-4">

            <h2 class="fw-bold">Login for website</h2>

            <p class="text-muted">Join us and start learning today</p>

          </div>

          

          <div class="row">
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="User name" id="username">
            </div>

            <div class="mb-3">
              <input type="email" class="form-control" placeholder="Email" id="login-email">
            </div>
            
            <div class="mb-3">
              <input type="password" class="form-control" placeholder="Password" id="login-password">
            </div>
          </div>

          <div class="text-center my-4">

            <p class="text-muted">Or continue with</p>

            <div class="d-flex justify-content-center gap-3">
              <a href="#" class="btn btn-light border rounded-circle"><i class="bi bi-google text-danger"></i></a>
              
              <a href="#" class="btn btn-light border rounded-circle"><i class="bi bi-facebook text-primary"></i></a>

              <a href="#" class="btn btn-light border rounded-circle"><i class="bi bi-apple"></i></a>
            </div>

          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary w-100" id="login"><i class="bi bi-person me-2"></i>Log In</button>
          <button type="button" class="bg-white border-0 my-3 w-100 text-center text-decoration-underline text-primary" id="btn-login">Don't have an account? Sign Up</button>
        </form>

      </div>

    </div>

  </div>
  <script src="/Session 9/js/signup.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>  
</body>
</html>
